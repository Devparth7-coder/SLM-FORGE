# Render deployment configuration for SLM-Forge backend
# Deploy via: render blueprint apply or manual Web Service creation using:
#   Build command: pip install -e ./backend[dev] && pip install -e ./cli && alembic upgrade head
#   Start command: cd backend && uvicorn slmforge.main:app --host 0.0.0.0 --port $PORT

services:
  - type: web
    name: slmforge-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: slmforge-db
          property: connectionString
      - key: REDIS_URL
        value: ""  # optional: set to Upstash/Render Redis URL
      - key: STORAGE_BACKEND
        value: local
      - key: WANDB_ENABLED
        value: "false"
      - key: FORCE_CPU
        value: "true"  # Render instances do not have GPUs
      - key: ALLOWED_ORIGINS
        value: "*"  # restrict in production

databases:
  - name: slmforge-db
    databaseName: slmforge
    user: slmforge
    plan: starter
