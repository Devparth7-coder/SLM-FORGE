[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-forge"
version = "0.1.0"
description = "Small Language Model Fine-Tuning & Evaluation Laboratory"
readme = "README.md"
license = {text = "Proprietary - Dev Parth"}
authors = [{name = "Dev Parth"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Web
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Database
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
    # ML
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "datasets>=2.15.0",
    "accelerate>=0.25.0",
    "peft>=0.7.0",
    "trl>=0.7.4",
    "bitsandbytes>=0.41.3; sys_platform != 'darwin'",
    "scikit-learn>=1.3.2",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "evaluate>=0.4.1",
    "safetensors>=0.4.0",
    "sentencepiece>=0.1.99",
    "protobuf>=4.25.0",
    # Experiment tracking
    "wandb>=0.16.0",
    # Data
    "pyarrow>=14.0.1",
    "pyyaml>=6.0.1",
    "jsonschema>=4.20.0",
    "rapidfuzz>=3.5.0",
    "datasketch>=1.6.4",
    # CLI
    "typer>=0.9.0",
    "rich>=13.7.0",
    # Observability
    "structlog>=23.2.0",
    # Utils
    "python-dotenv>=1.0.0",
    "click>=8.1.7",
    "tqdm>=4.66.1",
    "aiofiles>=23.2.1",
    "jinja2>=3.1.2",
    "matplotlib>=3.8.2",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "psutil>=5.9.6",
    "GPUtil>=1.4.0",
    "cryptography>=41.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.2",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.25.0",
    "ruff>=0.1.7",
    "black>=23.11.0",
    "mypy>=1.7.1",
    "types-PyYAML>=6.0.12",
    "ipython>=8.18.1",
]
test = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.2",
    "pytest-cov>=4.1.0",
]

[project.scripts]
slmforge = "slmforge.cli.main:app"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["slmforge*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["backend/tests", "cli/tests"]
pythonpath = ["backend", "cli"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.alembic]
script_location = "backend/alembic"
