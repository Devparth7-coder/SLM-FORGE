[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-forge"
version = "0.1.0"
description = "Small Language Model Fine-Tuning & Evaluation Laboratory"
readme = "README.md"
license = {text = "Proprietary - Dev Parth"}
authors = [{name = "Dev Parth"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Root pyproject.toml is a project meta-file only (workspace config).
# The backend has its own pyproject.toml at backend/pyproject.toml
# and is the installable Python package.
# No [tool.setuptools.packages.find] on purpose — this is not itself a package.

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-v --tb=short"
